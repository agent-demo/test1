name: Android APKs

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified ONNX model asset
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install -r ml/requirements-cpu.txt
          python ml/scripts/inspect_hf_model.py --out ml/artifacts
          python ml/scripts/export_onnx.py --model-dir ml/artifacts --output ml/artifacts/crop_saathi_v0.onnx
          mkdir -p apps/mobile/assets/models
          cp ml/artifacts/crop_saathi_v0.onnx apps/mobile/assets/models/crop_saathi_v0.onnx
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - name: Label artifacts as hackathon unsigned builds
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/crop-saathi-debug-unsigned.apk
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/crop-saathi-release-debug-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: crop-saathi-apks-${{ github.sha }}
          path: |
            apps/mobile/build/app/outputs/flutter-apk/crop-saathi-debug-unsigned.apk
            apps/mobile/build/app/outputs/flutter-apk/crop-saathi-release-debug-signed.apk
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/mobile/build/app/outputs/flutter-apk/crop-saathi-debug-unsigned.apk
            apps/mobile/build/app/outputs/flutter-apk/crop-saathi-release-debug-signed.apk
