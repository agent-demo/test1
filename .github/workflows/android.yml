name: Android APKs

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare verified ONNX model asset
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install -r ml/requirements-cpu.txt
          python ml/scripts/inspect_hf_model.py --revision 24abe2d06442f62d8168041ec539832cd39d397e --out ml/artifacts
          python ml/scripts/export_onnx.py --model-dir ml/artifacts --output ml/artifacts/crop_saathi_v0.onnx
          mkdir -p apps/mobile/assets/models
          cp ml/artifacts/crop_saathi_v0.onnx apps/mobile/assets/models/crop_saathi_v0.onnx
      - run: flutter pub get
      - name: Build debug APK
        id: build-debug
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee "$RUNNER_TEMP/flutter-build-debug.log"
      - name: Show debug build failure tail
        if: steps.build-debug.outcome == 'failure'
        run: tail -n 220 "$RUNNER_TEMP/flutter-build-debug.log"
      - name: Surface actionable Android build errors
        if: steps.build-debug.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pathlib import Path

          log = Path(__import__('os').environ['RUNNER_TEMP']) / 'flutter-build-debug.log'
          lines = log.read_text(errors='replace').splitlines()
          markers = (
              'FAILURE:',
              '* What went wrong:',
              'Execution failed for task',
              'Could not determine the dependencies',
              'A problem occurred',
              'error: ',
              'Error: ',
              'Gradle task ',
          )
          selected = [line.strip() for line in lines if any(marker in line for marker in markers)]
          selected = selected[-12:] or [line.strip() for line in lines[-12:]]
          for line in selected:
              safe = line.replace('%', '%25').replace('\r', '').replace('\n', ' ').replace('::', '__')
              print(f'::error file=.github/workflows/android.yml,line=1,title=Android build::{safe}')
          PY
      - name: Upload debug build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crop-saathi-android-build-log-${{ github.sha }}
          path: ${{ runner.temp }}/flutter-build-debug.log
          if-no-files-found: warn
      - name: Fail if debug build failed
        if: steps.build-debug.outcome == 'failure'
        run: exit 1
      - run: flutter build apk --release --verbose
      - name: Label artifacts as hackathon unsigned builds
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/crop-saathi-debug-unsigned.apk
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/crop-saathi-release-debug-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: crop-saathi-apks-${{ github.sha }}
          path: |
            apps/mobile/build/app/outputs/flutter-apk/crop-saathi-debug-unsigned.apk
            apps/mobile/build/app/outputs/flutter-apk/crop-saathi-release-debug-signed.apk
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/mobile/build/app/outputs/flutter-apk/crop-saathi-debug-unsigned.apk
            apps/mobile/build/app/outputs/flutter-apk/crop-saathi-release-debug-signed.apk
